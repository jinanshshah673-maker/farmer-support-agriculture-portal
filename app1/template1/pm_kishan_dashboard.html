{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>PM Kisan Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container py-5">

<h1 class="text-center text-success mb-4">

PM Kisan Live Dashboard

</h1>

<table class="table table-bordered table-striped">

<thead class="table-success">

<tr>

<th>SL No</th>

<th>District</th>

<th>Beneficiaries</th>

</tr>

</thead>

<tbody>

{% for row in records %}

<tr>

<td>{{ row.sl_no }}</td>

<td>{{ row.district }}</td>

<td>{{ row.number_of_beneficiaries }}</td>

</tr>

{% endfor %}

</tbody>

</table>

</div>

</body>
</html>
